name: Publish
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    # 只跟随 main 上的 CI。没有这一行，任何分支的 CI 成功都会触发发布任务。
    branches:
      - main
  push:
    branches:
      - "main"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    # push 事件里没有 workflow_run 这个字段，只写后面那一半会把 push 触发全部挡掉。
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 这里原本是 pnpm/action-setup@v2 + version: 8，与仓库对不上：lockfile 是
      # lockfileVersion '9.0'，packageManager 写的是 pnpm@12.5.1。
      # setup-vp 按 packageManager 字段装包管理器，不再手写版本号。
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: '22'
          cache: true
          # 同 CI：action 自带的 install 不带 --frozen-lockfile，会先把 lockfile
          # 改掉，让下一步的 --frozen-lockfile 失效。
          run-install: false

      - run: vp install --frozen-lockfile
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
